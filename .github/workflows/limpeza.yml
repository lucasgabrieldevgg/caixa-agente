name: Limpeza de caixas antigas

on:
  schedule:
    - cron: '17 6 * * *'   # todo dia às 06:17 UTC (03:17 em Brasília)
  workflow_dispatch: {}      # permite rodar manualmente na aba Actions

jobs:
  limpar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instala firebase-admin
        run: npm install firebase-admin@12 --no-save --silent

      - name: Remove caixas vencidas (TTL)
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TTL_DIAS: '7'
        run: node scripts/limpeza.mjs
