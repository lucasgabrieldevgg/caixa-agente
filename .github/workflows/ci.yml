name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test
      - name: higiene
        run: |
          grep -q "IBM Plex Mono" index.html
          grep -q "VT323" index.html
          if grep -qE "radial-gradient|7c5cff|4f6df5" index.html; then echo "delator visual"; exit 1; fi
          if grep -rEn "ghp_[A-Za-z0-9]{20}|sk-or-v1-|vcp_[A-Za-z0-9]{20}" index.html scripts/; then echo "segredo real exposto"; exit 1; fi
          test -f LICENSE
